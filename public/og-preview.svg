<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Akash Kumar Yadav portfolio</title>
  <desc id="desc">Portfolio preview featuring a modern profile and technology layout.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#070b14"/>
      <stop offset="100%" stop-color="#101a2b"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7C8CFF"/>
      <stop offset="100%" stop-color="#6EE7D7"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="980" cy="120" r="180" fill="#7C8CFF" opacity="0.18"/>
  <circle cx="220" cy="500" r="180" fill="#6EE7D7" opacity="0.10"/>
  <rect x="90" y="90" width="1020" height="450" rx="28" fill="#0E1729" stroke="rgba(255,255,255,0.1)"/>
  <g transform="translate(160 170)">
    <rect width="260" height="260" rx="28" fill="#131f33"/>
    <rect x="30" y="30" width="200" height="200" rx="22" fill="url(#accent)" opacity="0.28"/>
    <text x="130" y="138" font-family="Segoe UI, Arial, sans-serif" font-size="92" font-weight="700" text-anchor="middle" fill="#EDF5FF">A</text>
  </g>
  <g transform="translate(520 190)">
    <text x="0" y="42" font-family="Segoe UI, Arial, sans-serif" font-size="26" font-weight="700" fill="#6EE7D7" letter-spacing="4">AKASH KUMAR YADAV</text>
    <text x="0" y="120" font-family="Segoe UI, Arial, sans-serif" font-size="74" font-weight="800" fill="#EDF5FF">Android &amp; Java</text>
    <text x="0" y="180" font-family="Segoe UI, Arial, sans-serif" font-size="74" font-weight="800" fill="#EDF5FF">Developer</text>
    <text x="0" y="250" font-family="Segoe UI, Arial, sans-serif" font-size="24" fill="#A7B4CA">Building practical, polished digital products.</text>
    <rect x="0" y="300" width="260" height="52" rx="14" fill="url(#accent)"/>
    <text x="130" y="335" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="700" fill="#091320">VIEW PROJECTS</text>
  </g>
</svg>
