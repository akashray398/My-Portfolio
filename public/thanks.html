<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Message sent | Akash Kumar Yadav</title>
    <meta name="theme-color" content="#070b14" />
    <style>
      :root {
        --bg: #070b14;
        --card: #101a2b;
        --text: #edf5ff;
        --muted: #a7b4ca;
        --primary: #7c8cff;
        --secondary: #6ee7d7;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: 'Segoe UI', sans-serif;
        background: radial-gradient(circle at top left, rgba(124,140,255,0.14), transparent 22%), var(--bg);
        color: var(--text);
      }
      .card {
        width: min(540px, calc(100vw - 2rem));
        padding: 2rem 1.5rem;
        border: 1px solid rgba(148, 163, 184, 0.18);
        border-radius: 22px;
        background: rgba(16, 26, 43, 0.94);
        box-shadow: 0 25px 80px rgba(5, 10, 20, 0.45);
        text-align: center;
      }
      .badge {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        padding: 0.5rem 0.8rem;
        border-radius: 999px;
        background: rgba(110, 231, 215, 0.09);
        border: 1px solid rgba(110, 231, 215, 0.25);
        color: var(--secondary);
        font-size: 0.7rem;
        letter-spacing: 0.12em;
        text-transform: uppercase;
      }
      h1 {
        margin: 1rem 0 0.6rem;
        font-size: clamp(2rem, 5vw, 3rem);
      }
      p {
        margin: 0;
        color: var(--muted);
        line-height: 1.7;
      }
      a {
        display: inline-flex;
        margin-top: 1.5rem;
        padding: 0.8rem 1.1rem;
        border-radius: 12px;
        background: linear-gradient(135deg, var(--primary), #5d6ef7);
        color: #fff;
        text-decoration: none;
        font-weight: 700;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <div class="badge">Message sent</div>
      <h1>Thanks for reaching out.</h1>
      <p>Your message has been successfully submitted, and I’ll get back to you soon.</p>
      <a href="/">Return to portfolio</a>
    </main>
  </body>
</html>
